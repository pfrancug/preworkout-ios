name: iOS

# Builds are manual only (GitHub Actions macOS minutes are limited):
# - tag v*.*.* -> signed archive + TestFlight upload
# - Actions -> iOS -> Run workflow:
#     upload = true  -> signed archive + TestFlight upload
#     upload = false -> unsigned compile check only
# Pushes and pull requests do NOT start any run.
# Xcode 27 (iOS 27 SDK) lives on the xcode-27 image, not macos-15/macos-26.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight (false = unsigned compile check only)'
        type: boolean
        default: true

# A newer run for the same ref cancels the older one.
concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: PreWorkout

jobs:
  build:
    name: Compile check
    if: github.event_name == 'workflow_dispatch' && !inputs.upload
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
          elif [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          elif [ -d /Applications/Xcode_27.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iOS' || true

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (device SDK, unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project PreWorkout.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log
          echo '--- warnings ---'
          grep -E 'warning:|deprecated' build/xcodebuild.log || echo 'No compiler warnings.'

      - name: Check localizations
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphoneos/PreWorkout.app
          for lang in pl en; do
            ls "$APP/$lang.lproj"
            test -f "$APP/$lang.lproj/InfoPlist.strings"
          done
          test -f "$APP/en.lproj/Localizable.strings"
          test -d "$APP/PlugIns/PreWorkoutLiveActivity.appex"
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist"
          plutil -p "$APP/en.lproj/Localizable.strings" | head -5
          /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' "$APP/Info.plist"

  testflight:
    name: Archive and upload to TestFlight
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID BUNDLE_ID API_BASE_URL SENTRY_AUTH_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret for $name"; missing=1; fi
          done
          exit $missing

      - name: Select Xcode 27
        run: |
          if [ -d /Applications/Xcode_27.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.2.app
          elif [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          elif [ -d /Applications/Xcode_27.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.app
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iOS' || true

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Optional: only when you prefer your own distribution certificate over
      # Xcode cloud signing. Skipped when the secret is empty.
      - name: Import distribution certificate (optional)
        if: env.DIST_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Versions
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MARKETING_VERSION=$(grep -E 'MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*\"(.*)\".*/\1/')" >> "$GITHUB_ENV"
          fi
          # Unique, always increasing build number for TestFlight.
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Archive (signed)
        run: |
          xcodebuild archive -quiet \
            -project PreWorkout.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PreWorkout.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            APP_BUNDLE_ID="$BUNDLE_ID" \
            API_BASE_URL="$API_BASE_URL" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"


      - name: Upload dSYMs to Sentry
        env:
          SENTRY_ORG: piotr-francug
          SENTRY_PROJECT: preworkout-ios
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli debug-files upload "$RUNNER_TEMP/PreWorkout.xcarchive"

      - name: Export and upload to TestFlight
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PreWorkout.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded PreWorkout $MARKETING_VERSION ($BUILD_NUMBER) to App Store Connect." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
