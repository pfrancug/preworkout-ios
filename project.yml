# XcodeGen spec: the .xcodeproj is generated from this file with
# `xcodegen generate` and is not committed.
name: PreWorkout
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.7"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Catch Swift 6 isolation issues while staying on the Swift 5 language mode.
    SWIFT_STRICT_CONCURRENCY: complete
    # Overridden in CI from repository secrets / variables. The Live Activity
    # extension uses the same id with a `.LiveActivity` suffix.
    APP_BUNDLE_ID: com.example.preworkout
    DEVELOPMENT_TEAM: ""
    # Empty in the repository: CI injects it from the API_BASE_URL secret.
    # Without it the server address is entered on the sign-in screen.
    API_BASE_URL: ""

targets:
  PreWorkout:
    type: application
    platform: iOS
    sources:
      - path: PreWorkout
      - path: Shared
    dependencies:
      - target: PreWorkoutLiveActivity
      - sdk: HealthKit.framework
    info:
      path: PreWorkout/Info.plist
      properties:
        CFBundleDisplayName: PreWorkout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        APIBaseURL: $(API_BASE_URL)
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: PreWorkout odczytuje wagę z aplikacji Health, żeby pokazać historię i trzymać ją w zgodzie z dziennikiem.
        NSHealthUpdateUsageDescription: PreWorkout zapisuje wagę do aplikacji Health, gdy dodasz lub zmienisz pomiar w dzienniku.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: PreWorkout/PreWorkout.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  PreWorkoutLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: PreWorkoutLiveActivity
      - path: Shared
    info:
      path: PreWorkoutLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: PreWorkout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).LiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  PreWorkout:
    build:
      targets:
        PreWorkout: all
    archive:
      config: Release
