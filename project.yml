# XcodeGen spec: the .xcodeproj is generated from this file with
# `xcodegen generate` and is not committed.
name: PreWorkout
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Overridden in CI from repository secrets / variables.
    PRODUCT_BUNDLE_IDENTIFIER: com.example.preworkout
    DEVELOPMENT_TEAM: ""
    # Empty in the repository: CI injects it from the API_BASE_URL secret.
    # Without it the server address is entered on the sign-in screen.
    API_BASE_URL: ""

targets:
  PreWorkout:
    type: application
    platform: iOS
    sources:
      - path: PreWorkout
    info:
      path: PreWorkout/Info.plist
      properties:
        CFBundleDisplayName: PreWorkout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        APIBaseURL: $(API_BASE_URL)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  PreWorkout:
    build:
      targets:
        PreWorkout: all
    archive:
      config: Release
